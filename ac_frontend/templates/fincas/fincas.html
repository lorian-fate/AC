<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gestión de Fincas</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
<style>
  body {
    padding: 1rem;
    background: #f8f3ec;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  h1 {
    color: #4a47a3;
  }
  button#createFincaBtn {
    background-color: #4caf50;
    border: none;
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  button#createFincaBtn:hover {
    background-color: #45a049;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }
  th, td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th {
    background: #6e8efb;
    color: white;
    user-select: none;
  }
  tr:hover {
    background: #f0f4fe;
  }
  .action-btn {
    margin-right: 0.5rem;
    padding: 0.3rem 0.6rem;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  .edit-btn {
    background-color: #6e8efb;
  }
  .edit-btn:hover {
    background-color: #5a6ed9;
  }
  .delete-btn {
    background-color: #e05252;
  }
  .delete-btn:hover {
    background-color: #c94040;
  }
  /* Modal styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center; align-items: center;
  }
  .modal.active {
    display: flex;
  }
  .modal-content {
    background: white;
    border-radius: 12px;
    padding: 1.5rem 2rem;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }
  .modal-content label {
    font-weight: 600;
    margin-top: 1rem;
    display: block;
  }
  .modal-content input, .modal-content textarea {
    width: 100%;
    margin-top: 0.3rem;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
    font-family: inherit;
  }
  .modal-content textarea {
    resize: vertical;
    min-height: 80px;
  }
  .modal-actions {
    margin-top: 1.5rem;
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
  }
  .modal-actions button {
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel {
    background: #ccc;
    color: #333;
  }
  .btn-cancel:hover {
    background: #bbb;
  }
  .btn-save {
    background: #4a47a3;
    color: white;
  }
  .btn-save:hover {
    background: #5a57b9;
  }
  /* Responsive */
  @media (max-width: 600px) {
    th, td {
      padding: 0.5rem;
      font-size: 0.9rem;
    }
    button#createFincaBtn {
      width: 100%;
      margin-bottom: 1rem;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Gestión de Fincas</h1>
  <a href="{{ url_for('dashboard') }}" class="btn-cancel" style="text-decoration:none; padding:0.5rem 1rem; border-radius:8px; background:#ccc; color:#333;">Volver al Dashboard</a>
</header>

<button id="createFincaBtn">Crear Finca</button>

<table aria-label="Lista de fincas">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Dirección</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="fincasBody">
    <!-- Fincas se cargarán aquí -->
  </tbody>
</table>

<!-- Modal Crear/Editar -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h2 id="modalTitle">Crear Finca</h2>
    <form id="fincaForm">
      <input type="hidden" id="fincaId" />
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" name="nombre" required />
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" />
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion"></textarea>
      <label for="responsable">Responsable</label>
      <input type="text" id="responsable" name="responsable" />
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn-save">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const modal = document.getElementById('modal');
  const fincaForm = document.getElementById('fincaForm');
  const fincasBody = document.getElementById('fincasBody');
  const createFincaBtn = document.getElementById('createFincaBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const modalTitle = document.getElementById('modalTitle');
  const fincaIdInput = document.getElementById('fincaId');

  // Escapar texto para evitar XSS
  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, function(m) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
    });
  }

  async function loadFincas() {
    const res = await fetch('/api/fincas');
    const fincas = await res.json();
    fincasBody.innerHTML = '';
    fincas.forEach(finca => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(finca.nombre)}</td>
        <td>${escapeHtml(finca.direccion || '')}</td>
        <td>${escapeHtml(finca.descripcion || '')}</td>
        <td>
          <button class="action-btn edit-btn" data-id="${finca.id}" aria-label="Editar finca ${escapeHtml(finca.nombre)}">Editar</button>
          <button class="action-btn delete-btn" data-id="${finca.id}" aria-label="Eliminar finca ${escapeHtml(finca.nombre)}">Eliminar</button>
        </td>
      `;
      fincasBody.appendChild(tr);
    });
  }

  function openModal(edit = false, finca = null) {
    modal.classList.add('active');
    if (edit && finca) {
      modalTitle.textContent = 'Editar Finca';
      fincaIdInput.value = finca.id;
      fincaForm.nombre.value = finca.nombre;
      fincaForm.direccion.value = finca.direccion || '';
      fincaForm.descripcion.value = finca.descripcion || '';
      fincaForm.responsable.value = finca.responsable || '';
    } else {
      modalTitle.textContent = 'Crear Finca';
      fincaIdInput.value = '';
      fincaForm.reset();
    }
    fincaForm.nombre.focus();
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  createFincaBtn.addEventListener('click', () => openModal());

  cancelBtn.addEventListener('click', closeModal);

  fincaForm.addEventListener('submit', async e => {
    e.preventDefault();

    const id = fincaIdInput.value;
    const data = {
      nombre: fincaForm.nombre.value.trim(),
      direccion: fincaForm.direccion.value.trim(),
      descripcion: fincaForm.descripcion.value.trim(),
      responsable: fincaForm.responsable.value.trim()
    };

    if (!data.nombre) {
      alert('El nombre es obligatorio.');
      return;
    }

    let url = '/api/fincas';
    let method = 'POST';
    if (id) {
      url += `/${id}`;
      method = 'PUT';
    }

    const res = await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await res.json();

    if (result.success) {
      closeModal();
      loadFincas();
    } else {
      alert(result.message || 'Error al guardar la finca.');
    }
  });

  fincasBody.addEventListener('click', async e => {
    if (e.target.classList.contains('edit-btn')) {
      const id = e.target.dataset.id;
      const res = await fetch('/api/fincas');
      const fincas = await res.json();
      const finca = fincas.find(f => f.id == id);
      if (finca) openModal(true, finca);
    } else if (e.target.classList.contains('delete-btn')) {
      const id = e.target.dataset.id;
      if (confirm('¿Estás seguro de eliminar esta finca?')) {
        const res = await fetch(`/api/fincas/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          loadFincas();
        } else {
          alert(result.message || 'Error al eliminar la finca.');
        }
      }
    }
  });

  // Carga inicial
  loadFincas();
</script>
</body>
</html>
