<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  <title>Registro Amigable</title>
</head>
<body>
  <div class="login-container" role="main" aria-label="Formulario de registro">
    <h2>Crear Cuenta</h2>

    <form id="registerForm" novalidate>
      <div class="input-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required aria-required="true" aria-describedby="usuarioError" />
        <div id="usuarioError" class="error-message">Por favor, introduce un usuario.</div>
      </div>

      <div class="input-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required aria-required="true" aria-describedby="correoError" />
        <div id="correoError" class="error-message">Por favor, introduce un correo válido.</div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="********" required aria-required="true" aria-describedby="passwordError" minlength="6" />
        <div id="passwordError" class="error-message">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      <button type="submit" class="btn-login" aria-label="Registrarse">Registrarse</button>
    </form>

    <p class="helper-text">¿Ya tienes cuenta? <a href="/" tabindex="0">Inicia sesión aquí</a></p>

    <div id="formMessage" role="alert"></div>
  </div>
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
