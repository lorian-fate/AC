<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  <title>Registro Amigable</title>
</head>
<body>
  <div class="login-container" role="main" aria-label="Formulario de registro">
    <h2>Crear Cuenta</h2>

    <form id="registerForm" novalidate>
      <div class="input-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required aria-required="true" aria-describedby="usuarioError" />
        <div id="usuarioError" class="error-message">Por favor, introduce un usuario.</div>
      </div>

      <div class="input-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required aria-required="true" aria-describedby="correoError" />
        <div id="correoError" class="error-message">Por favor, introduce un correo válido.</div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="********" required aria-required="true" aria-describedby="passwordError" minlength="6" />
        <div id="passwordError" class="error-message">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      <button type="submit" class="btn-login" aria-label="Registrarse">Registrarse</button>
    </form>

    <p class="helper-text">¿Ya tienes cuenta? <a href="/" tabindex="0">Inicia sesión aquí</a></p>

    <div id="formMessage" role="alert"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const formMessage = document.getElementById('formMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Ocultar mensajes previos
      formMessage.textContent = '';
      const usuario = form.usuario.value.trim();
      const correo = form.correo.value.trim();
      const password = form.password.value;

      // Validaciones básicas en frontend
      let valid = true;

      if (!usuario) {
        document.getElementById('usuarioError').style.display = 'block';
        valid = false;
      } else {
        document.getElementById('usuarioError').style.display = 'none';
      }

      if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        document.getElementById('correoError').style.display = 'block';
        valid = false;
      } else {
        document.getElementById('correoError').style.display = 'none';
      }

      if (!password || password.length < 6) {
        document.getElementById('passwordError').style.display = 'block';
        valid = false;
      } else {
        document.getElementById('passwordError').style.display = 'none';
      }

      if (!valid) return;

      try {
        const response = await fetch('api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, correo, password })
        });

        const result = await response.json();

        if (response.ok) {
          formMessage.style.color = 'green';
          formMessage.textContent = result.message;
          form.reset();
        } else {
          formMessage.style.color = 'red';
          formMessage.textContent = result.message || 'Error desconocido';
        }
      } catch (error) {
        formMessage.style.color = 'red';
        formMessage.textContent = 'Error de conexión';
      }
    });
  </script>
</body>
</html>
