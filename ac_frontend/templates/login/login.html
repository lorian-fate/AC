<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  <title>Login Amigable</title>
</head>
<body>
  <div class="login-container" role="main" aria-label="Formulario de inicio de sesión">
    <h2>Bienvenido</h2>
    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required aria-required="true" aria-describedby="emailError" />
        <div id="emailError" class="error-message">Por favor, introduce un correo válido.</div>
      </div>

      <div class="input-group input-password-container">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="********" required aria-required="true" aria-describedby="passwordError" minlength="6" />
        <button type="button" class="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña" tabindex="0">
          👁️
        </button>
        <div id="passwordError" class="error-message">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      <button type="submit" class="btn-login" aria-label="Iniciar sesión">Iniciar sesión</button>
    </form>

    <p class="helper-text">¿No tienes cuenta? <a href="#" tabindex="0">Regístrate aquí</a></p>
  </div>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
